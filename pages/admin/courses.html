<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Courses — AttendX Admin</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1><i data-lucide="book-open"></i> Courses</h1>
      <p>All courses registered in the system.</p>
    </div>

    <div class="admin-actions-bar">
      <div class="search-box">
        <span class="search-icon"><i data-lucide="search"></i></span>
        <input type="text" id="searchInput" placeholder="Search by name or code…" oninput="filterTable()"/>
      </div>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>#</th><th>Course Name</th><th>Code</th><th>Teacher</th><th>Enrolled</th><th>Actions</th></tr>
          </thead>
          <tbody id="coursesTable">
            <tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Courses");

  let allCourses = [];

  async function loadCourses() {
    allCourses = await api.get("/admin/courses");
    renderCourses(allCourses);
  }

  function renderCourses(courses) {
    const tbody = document.getElementById("coursesTable");
    if (!courses.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">No courses found.</td></tr>`;
      return;
    }
    tbody.innerHTML = courses.map((c, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${c.name}</td>
        <td><code>${c.code}</code></td>
        <td>${c.teacher}</td>
        <td><span class="badge badge-info">${c.enrolled} students</span></td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="deleteCourse(${c.id}, '${c.name}')"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>
    `).join("");
  }

  function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    renderCourses(allCourses.filter(c =>
      c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)
    ));
  }

  async function deleteCourse(id, name) {
    if (!confirm(`Delete course "${name}"? All sessions and records will be lost.`)) return;
    try {
      await api.delete(`/admin/courses/${id}`);
      showToast("Course deleted.", "success");
      loadCourses();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  loadCourses().catch(() => showToast("Failed to load courses", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
