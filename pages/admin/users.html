<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Users — AttendX Admin</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>👥 Users</h1>
      <p>Manage all registered users in the system.</p>
    </div>

    <div class="admin-actions-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name or email…" oninput="filterTable()"/>
      </div>
      <button class="btn btn-primary" onclick="openModal('addUserModal')">+ Add User</button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>
          </thead>
          <tbody id="usersTable">
            <tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add User Modal -->
<div class="modal-overlay" id="addUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New User</h3>
      <button class="modal-close" onclick="closeModal('addUserModal')">✕</button>
    </div>
    <form id="addUserForm">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input id="uName" type="text" class="form-control" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="uEmail" type="email" class="form-control" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="uPassword" type="password" class="form-control" required minlength="8"/>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="uRole" class="form-control">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group" id="uStudentIdGroup">
        <label class="form-label">Student ID</label>
        <input id="uStudentId" type="text" class="form-control" placeholder="2021-CSE-001"/>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem">
        <button type="button" class="btn btn-outline" onclick="closeModal('addUserModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Create User</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Users");

  let allUsers = [];

  async function loadUsers() {
    allUsers = await api.get("/admin/users");
    renderUsers(allUsers);
  }

  function renderUsers(users) {
    const tbody = document.getElementById("usersTable");
    if (!users.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">No users found.</td></tr>`;
      return;
    }
    const roleColors = { admin: "badge-danger", teacher: "badge-info", student: "badge-success" };
    tbody.innerHTML = users.map((u, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td><span class="badge ${roleColors[u.role] || 'badge-neutral'}">${u.role}</span></td>
        <td>${fmtDate(u.created_at)}</td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${u.name}')">🗑</button>
        </td>
      </tr>
    `).join("");
  }

  function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    renderUsers(allUsers.filter(u =>
      u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    ));
  }

  async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
    try {
      await api.delete(`/admin/users/${id}`);
      showToast("User deleted.", "success");
      loadUsers();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  document.getElementById("uRole").addEventListener("change", function() {
    document.getElementById("uStudentIdGroup").style.display = this.value === "student" ? "" : "none";
  });

  document.getElementById("addUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const role = document.getElementById("uRole").value;
    const payload = {
      name:     document.getElementById("uName").value.trim(),
      email:    document.getElementById("uEmail").value.trim(),
      password: document.getElementById("uPassword").value,
      role,
    };
    if (role === "student") payload.student_id = document.getElementById("uStudentId").value.trim();
    try {
      await api.post("/auth/register", payload);
      showToast("User created!", "success");
      closeModal("addUserModal");
      e.target.reset();
      loadUsers();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  loadUsers().catch(() => showToast("Failed to load users", "error"));
</script>
</body>
</html>
