<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Attendance — AttendX</title>
  <meta name="description" content="Run live face recognition attendance for your course."/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 id="courseTitle">Loading…</h1>
        <p id="courseSubtitle" class="text-muted"></p>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem; border-bottom:1px solid var(--border-light); padding-bottom:0.5rem; flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="tab-camera" onclick="switchTab('camera')"><i data-lucide="camera"></i> Live Attendance</button>
      <button class="btn btn-outline btn-sm" id="tab-history" onclick="switchTab('history')"><i data-lucide="calendar"></i> Session History</button>
      <button class="btn btn-outline btn-sm" id="tab-students" onclick="switchTab('students')"><i data-lucide="users"></i> Students</button>
    </div>

    <!-- Camera Tab -->
    <div id="panel-camera">
      <div class="camera-section">
        <div>
          <div class="camera-box" id="cameraBox">
            <video id="cameraFeed" autoplay playsinline muted></video>
            <canvas id="cameraCanvas"></canvas>
          </div>
          <div class="camera-controls">
            <button class="btn btn-primary" id="startBtn" onclick="startCamera()"><i data-lucide="play"></i> Start Camera</button>
            <button class="btn btn-outline hidden" id="stopScanBtn" onclick="stopScan()"><i data-lucide="square"></i> Stop</button>
            <button class="btn btn-accent hidden" id="startScanBtn" onclick="startScan()"><i data-lucide="search"></i> Start Scan</button>
          </div>
        </div>
        <div class="scan-results">
          <h3><i data-lucide="file-text"></i> Attendance Draft</h3>
          <div class="scan-list" id="scanList">
            <p class="text-muted" style="text-align:center;padding:1rem">Start the camera to begin scanning…</p>
          </div>
          <div class="scan-confirm-bar">
            <button class="btn btn-outline btn-sm" onclick="resetDraft()"><i data-lucide="refresh-cw"></i> Reset</button>
            <button class="btn btn-primary btn-sm" id="confirmBtn" onclick="confirmAttendance()" disabled><i data-lucide="check-circle"></i> Confirm & Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- History Tab -->
    <div id="panel-history" class="hidden">
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Date</th><th>Present</th><th>Total</th><th>Rate</th></tr></thead>
            <tbody id="historyTable"><tr><td colspan="4" class="text-muted" style="text-align:center;padding:1.5rem">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Students Tab -->
    <div id="panel-students" class="hidden">
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead><tr><th>#</th><th>Student ID</th><th>Name</th><th>Face</th></tr></thead>
            <tbody id="studentsTable"><tr><td colspan="4" class="text-muted" style="text-align:center;padding:1.5rem">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("teacher")) throw new Error("Unauthorized");
  renderSidebar("teacher", "My Courses");

  const params    = new URLSearchParams(location.search);
  const courseId  = parseInt(params.get("id"));
  if (!courseId) { showToast("No course selected", "error"); }

  let courseData   = null;
  let stream       = null;
  let scanInterval = null;
  let draftRecords = {}; // student_id -> { present, username, student_id_str, confidence }
  let scanning     = false;

  async function loadCourse() {
    try {
      const data = await api.get(`/teacher/courses/${courseId}`);
      courseData = data;
      document.getElementById("courseTitle").textContent = data.course.name;
      document.getElementById("courseSubtitle").textContent = `Students enrolled by admin`;
      renderHistory(data.sessions);
      renderStudents(data.students);
      // Initialize draft
      data.students.forEach(s => {
        draftRecords[s.id] = { username: s.username, student_id_str: s.student_id, present: false, confidence: 0 };
      });
      renderDraft();
    } catch (err) {
      showToast("Failed to load course", "error");
    }
  }

  function renderHistory(sessions) {
    const tbody = document.getElementById("historyTable");
    if (!sessions.length) { tbody.innerHTML = `<tr><td colspan="4" class="text-muted" style="text-align:center;padding:1.5rem">No classes yet.</td></tr>`; return; }
    tbody.innerHTML = sessions.map(s => {
      const rate = s.total ? Math.round(s.present / s.total * 100) : 0;
      const cls = rate >= 75 ? "badge-success" : rate >= 50 ? "badge-warning" : "badge-danger";
      return `<tr>
        <td>${fmtDate(s.date)}</td><td>${s.present}</td><td>${s.total}</td>
        <td><span class="badge ${cls}">${rate}%</span></td>
      </tr>`;
    }).join("");
  }

  function renderStudents(students) {
    const tbody = document.getElementById("studentsTable");
    if (!students.length) { tbody.innerHTML = `<tr><td colspan="4" class="text-muted" style="text-align:center;padding:1.5rem">No students enrolled.</td></tr>`; return; }
    tbody.innerHTML = students.map((s, i) => `
      <tr>
        <td>${i+1}</td>
        <td><code>${s.student_id || '—'}</code></td>
        <td>${s.username}</td>
        <td>${s.face_enrolled ? '<span class="badge badge-success"><i data-lucide="check-circle"></i> Enrolled</span>' : '<span class="badge badge-danger"><i data-lucide="x-circle"></i> Missing</span>'}</td>
      </tr>
    `).join("");
    if (window.lucide) lucide.createIcons();
  }

  function renderDraft() {
    const list = document.getElementById("scanList");
    const entries = Object.entries(draftRecords);
    if (!entries.length) { list.innerHTML = `<p class="text-muted" style="text-align:center;padding:1rem">No students enrolled.</p>`; return; }
    list.innerHTML = entries.map(([sid, r]) => `
      <div class="scan-item ${r.present ? 'present' : ''}">
        <div class="scan-dot ${r.present ? 'green' : 'red'}"></div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:0.83rem">${r.username}</div>
          <div class="text-muted">${r.student_id_str || '—'} ${r.confidence ? '· ' + (r.confidence*100).toFixed(1) + '%' : ''}</div>
        </div>
        <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;font-size:0.75rem">
          <input type="checkbox" ${r.present ? 'checked' : ''} onchange="toggleManual(${sid}, this.checked)"/>P
        </label>
      </div>
    `).join("");
    document.getElementById("confirmBtn").disabled = false;
  }

  function toggleManual(studentId, present) {
    if (draftRecords[studentId]) draftRecords[studentId].present = present;
    renderDraft();
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: "user" }, audio: false });
      document.getElementById("cameraFeed").srcObject = stream;
      document.getElementById("startBtn").classList.add("hidden");
      document.getElementById("stopScanBtn").classList.remove("hidden");
      document.getElementById("startScanBtn").classList.remove("hidden");
      showToast("Camera started. Click 'Start Scan' to begin.", "info");
    } catch (err) {
      showToast("Could not access camera: " + err.message, "error");
    }
  }

  function startScan() {
    if (!stream) return;
    scanning = true;
    document.getElementById("startScanBtn").textContent = "⏸ Scanning…";
    scanInterval = setInterval(captureAndScan, 2000);
  }

  async function captureAndScan() {
    const video  = document.getElementById("cameraFeed");
    const canvas = document.getElementById("cameraCanvas");
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);
    const frame = canvas.toDataURL("image/jpeg", 0.8);

    try {
      const res = await api.post("/face/scan", { frame, course_id: courseId });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      res.matches.forEach(m => {
        const [x1, y1, x2, y2] = m.bbox;
        const matched = m.student_id !== null;
        ctx.strokeStyle = matched ? "#0F9B58" : "#FF4D6D";
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        ctx.fillStyle = matched ? "#0F9B58" : "#FF4D6D";
        ctx.font = "bold 14px Inter";
        ctx.fillText(m.name, x1, y1 - 6);

        if (matched && draftRecords[m.student_id]) {
          draftRecords[m.student_id].present    = true;
          draftRecords[m.student_id].confidence = m.confidence;
        }
      });
      renderDraft();
    } catch (err) { /* ignore scan errors */ }
  }

  function stopScan() {
    clearInterval(scanInterval);
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById("startBtn").classList.remove("hidden");
    document.getElementById("stopScanBtn").classList.add("hidden");
    document.getElementById("startScanBtn").classList.add("hidden");
    document.getElementById("startScanBtn").innerHTML = "<i data-lucide='search'></i> Start Scan";
    if (window.lucide) lucide.createIcons();
    document.getElementById("cameraCanvas").getContext("2d").clearRect(0, 0, 9999, 9999);
    showToast("Scan stopped. Review and confirm the draft.", "info");
  }

  function resetDraft() {
    if (!courseData) return;
    courseData.students.forEach(s => {
      draftRecords[s.id] = { username: s.username, student_id_str: s.student_id, present: false, confidence: 0 };
    });
    renderDraft();
  }

  async function confirmAttendance() {
    const presentIds = Object.entries(draftRecords)
      .filter(([_, r]) => r.present)
      .map(([sid]) => parseInt(sid));
    if (!presentIds.length) { showToast("No students marked present", "error"); return; }
    try {
      await api.post(`/teacher/courses/${courseId}/attendance`, {
        date: new Date().toISOString().split("T")[0],
        present_ids: presentIds,
      });
      showToast("Attendance confirmed and saved!", "success");
      loadCourse();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  function switchTab(tab) {
    ["camera","history","students"].forEach(t => {
      document.getElementById(`panel-${t}`).classList.toggle("hidden", t !== tab);
      document.getElementById(`tab-${t}`).classList.toggle("btn-primary", t === tab);
      document.getElementById(`tab-${t}`).classList.toggle("btn-outline", t !== tab);
    });
  }

  loadCourse();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
