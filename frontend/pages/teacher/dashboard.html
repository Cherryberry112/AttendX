<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Dashboard — AttendX</title>
  <meta name="description" content="View your assigned courses and take attendance."/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 id="greeting">Good morning </h1>
      <p>Here's what's happening with your courses today.</p>
    </div>

    <!-- Stats (Static Text Blocks) -->
    <div class="stat-text-grid" id="statsGrid">
      <div class="stat-text-item">
        <div class="stat-text-icon purple"><i data-lucide="book-open"></i></div>
        <div>
          <div class="stat-text-value" id="statCourses">—</div>
          <div class="stat-text-label">Assigned Courses</div>
        </div>
      </div>
      <div class="stat-text-item">
        <div class="stat-text-icon teal"><i data-lucide="users"></i></div>
        <div>
          <div class="stat-text-value" id="statStudents">—</div>
          <div class="stat-text-label">Total Students</div>
        </div>
      </div>
      <div class="stat-text-item">
        <div class="stat-text-icon yellow"><i data-lucide="calendar"></i></div>
        <div>
          <div class="stat-text-value" id="statClasses">—</div>
          <div class="stat-text-label">Classes Held</div>
        </div>
      </div>
    </div>

    <!-- Courses Section (Read-Only — Admin assigns courses) -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <h2>My Courses</h2>
      <span class="text-muted" style="font-size:0.8rem"><i data-lucide="info"></i> Courses are managed by admin</span>
    </div>
    <div class="courses-grid" id="coursesGrid">
      <div class="text-muted text-center" style="grid-column:1/-1; padding:3rem">Loading courses…</div>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("teacher")) throw new Error("Unauthorized");

  const user = Auth.getUser();
  const displayName = user.username || user.name || "Teacher";
  const hour = new Date().getHours();
  document.getElementById("greeting").textContent =
    `${hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening"}, ${displayName.split(" ")[0]} `;

  renderSidebar("teacher", "Dashboard");

  async function loadDashboard() {
    const courses = await api.get("/teacher/courses");
    const totalStudents = courses.reduce((sum, c) => sum + c.enrolled, 0);
    const totalClasses = courses.reduce((sum, c) => sum + c.total_classes, 0);
    document.getElementById("statCourses").textContent  = courses.length;
    document.getElementById("statStudents").textContent = totalStudents;
    document.getElementById("statClasses").textContent  = totalClasses;

    const grid = document.getElementById("coursesGrid");
    if (courses.length === 0) {
      grid.innerHTML = `<div class="card text-center" style="grid-column:1/-1;padding:3rem">
        <p style="font-size:2rem"><i data-lucide="book-open"></i></p>
        <p class="text-muted mt-1">No courses assigned yet. Ask your admin to assign courses to you.</p>
      </div>`;
      if (window.lucide) lucide.createIcons();
      return;
    }

    grid.innerHTML = courses.map(c => `
      <div class="course-card" onclick="window.location.href='course.html?id=${c.id}'">
        <div class="course-name">${c.name}</div>
        <div class="course-meta">
          <span><i data-lucide="users"></i> ${c.enrolled} enrolled</span>
          <span><i data-lucide="calendar"></i> ${c.total_classes} classes</span>
        </div>
      </div>
    `).join("");
    if (window.lucide) lucide.createIcons();
  }

  loadDashboard().catch(err => showToast("Failed to load data", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
