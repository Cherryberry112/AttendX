<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — AttendX Student</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>Your student information and enrollment status.</p>
    </div>

    <div class="card profile-card mb-2">
      <div class="profile-avatar-lg" id="profileAvatar">—</div>
      <div class="profile-info">
        <div class="role-badge">Student</div>
        <h2 id="profileName">Loading…</h2>
        <p id="profileEmail" class="text-muted"></p>
        <div style="margin-top:1rem; display:flex; gap:1.5rem; flex-wrap:wrap;">
          <div><span class="text-muted">ID: </span><code id="profileSid">—</code></div>
          <div><span class="text-muted">Phone: </span><span id="profilePhone">—</span></div>
          <div><span class="text-muted">Guardian: </span><span id="profileGuardian">—</span></div>
          <div><span class="text-muted">Face: </span><span id="profileFace">—</span></div>
          <div><span class="text-muted">Courses: </span><span id="profileCourses">—</span></div>
        </div>
        <div style="margin-top:1.25rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
          <a href="enroll.html" class="btn btn-accent btn-sm"><i data-lucide="smile"></i> Re-enroll Face</a>
          <button class="btn btn-outline btn-sm" onclick="toggleEdit()"><i data-lucide="edit-3"></i> Edit Profile</button>
        </div>
      </div>
    </div>

    <div class="card" id="editCard" style="display:none; margin-bottom: 2rem;">
      <h3 style="margin-bottom:1.5rem"><i data-lucide="edit-3"></i> Edit Profile</h3>
      <form id="profileForm">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input id="editName" type="text" class="form-control" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input id="editPhone" type="tel" class="form-control"/>
          </div>
          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input id="editSid" type="text" class="form-control" disabled style="background:#f4f4f6; cursor:not-allowed;"/>
            <small style="color:var(--danger); display:block; margin-top:0.25rem;">Contact admin to change ID</small>
          </div>
        </div>
        <div class="form-group" style="max-width: 300px; margin-top: 1rem;">
          <label class="form-label">Current Password (Required to save)</label>
          <input id="currentPassword" type="password" class="form-control" required/>
        </div>
        <div style="display:flex; justify-content:flex-end; gap: 0.5rem;">
          <button type="button" class="btn btn-outline" onclick="toggleEdit()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-bottom:1.5rem"><i data-lucide="book-open"></i> Course Attendance</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Course</th><th>Teacher</th><th>Attended</th><th>Total</th><th>%</th><th>Action</th></tr>
          </thead>
          <tbody id="coursesTable">
            <tr><td colspan="5" class="text-muted" style="text-align:center;padding:1.5rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("student")) throw new Error("Unauthorized");
  renderSidebar("student", "Profile");

  async function loadProfile() {
    const [profile, courses] = await Promise.all([api.get("/student/profile"), api.get("/student/courses")]);
    const initials = profile.username.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    document.getElementById("profileAvatar").textContent  = initials;
    document.getElementById("profileName").textContent    = profile.username;
    document.getElementById("profileEmail").textContent   = profile.email;
    document.getElementById("profileSid").textContent     = profile.student_id || "—";
    document.getElementById("profilePhone").textContent   = profile.phone || "—";
    document.getElementById("profileGuardian").textContent = profile.guardian_number || "—";
    document.getElementById("profileCourses").textContent = profile.total_courses;
    document.getElementById("profileFace").innerHTML      = profile.face_enrolled
      ? '<span class="badge badge-success"><i data-lucide="check-circle"></i> Enrolled</span>'
      : '<span class="badge badge-danger"><i data-lucide="x-circle"></i> Not Enrolled</span>';
      
    // Populate edit form
    document.getElementById("editName").value  = profile.username;
    document.getElementById("editPhone").value = profile.phone || "";
    document.getElementById("editSid").value   = profile.student_id || "None";
    
    if (window.lucide) lucide.createIcons();

    const tbody = document.getElementById("coursesTable");
    if (!courses.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted" style="text-align:center;padding:1.5rem">No courses yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = courses.map(c => {
      const pct = c.percentage;
      const cls = pct >= 75 ? "badge-success" : pct >= 50 ? "badge-warning" : "badge-danger";
      return `<tr>
        <td>${c.name}</td>
        <td>${c.teacher}</td>
        <td>${c.attended}</td>
        <td>${c.total_classes}</td>
        <td><span class="badge ${cls}">${pct}%</span></td>
        <td>
          <button class="btn btn-sm btn-outline" style="color:var(--danger); border-color:var(--danger);" onclick="unenrollCourse(${c.id}, '${c.name.replace(/'/g, "\\'")}')">
            <i data-lucide="x-circle"></i> Unenroll
          </button>
        </td>
      </tr>`;
    }).join("");
  }

  function toggleEdit() {
    const card = document.getElementById("editCard");
    const isHidden = card.style.display === "none";
    card.style.display = isHidden ? "block" : "none";
    if (isHidden) {
      document.getElementById("currentPassword").value = "";
      document.getElementById("editName").focus();
    }
  }

  async function unenrollCourse(id, name) {
    if (!confirm(`Are you sure you want to unenroll from ${name}?`)) return;
    try {
      await api.delete(`/student/courses/${id}/unenroll`);
      showToast("Successfully unenrolled", "success");
      loadProfile();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api.put("/student/profile", {
        username: document.getElementById("editName").value.trim(),
        phone:    document.getElementById("editPhone").value.trim(),
        current_password: document.getElementById("currentPassword").value
      });
      showToast("Profile updated successfully!", "success");
      toggleEdit();
      loadProfile();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  loadProfile().catch(() => showToast("Failed to load profile", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
