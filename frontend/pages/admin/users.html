<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Users — AttendX Admin</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1><i data-lucide="users"></i> Users</h1>
      <p>Manage all registered users in the system.</p>
    </div>

    <div class="admin-actions-bar">
      <div class="search-box">
        <span class="search-icon"><i data-lucide="search"></i></span>
        <input type="text" id="searchInput" placeholder="Search by name, email, or ID…" oninput="filterTable()"/>
      </div>
      <button class="btn btn-primary" onclick="openModal('addUserModal')">+ Add User</button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Type</th><th>Student ID</th><th>Phone</th><th>Guardian</th><th>Actions</th></tr>
          </thead>
          <tbody id="usersTable">
            <tr><td colspan="8" class="text-muted" style="text-align:center;padding:2rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add User Modal -->
<div class="modal-overlay" id="addUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New User</h3>
      <button class="modal-close" onclick="closeModal('addUserModal')">✕</button>
    </div>
    <form id="addUserForm">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input id="uName" type="text" class="form-control" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="uEmail" type="email" class="form-control" required/>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="uPassword" type="password" class="form-control" required minlength="8"/>
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select id="uType" class="form-control" onchange="toggleStudentFields('add')">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input id="uPhone" type="tel" class="form-control" placeholder="+880 1XXX XXXXXX"/>
      </div>
      <div id="addStudentFields">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input id="uStudentId" type="text" class="form-control" placeholder="2022-3-60-110"/>
          </div>
          <div class="form-group">
            <label class="form-label">Guardian Phone</label>
            <input id="uGuardian" type="tel" class="form-control" placeholder="+880 1XXX XXXXXX"/>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem">
        <button type="button" class="btn btn-outline" onclick="closeModal('addUserModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Create User</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit User</h3>
      <button class="modal-close" onclick="closeModal('editUserModal')">✕</button>
    </div>
    <form id="editUserForm">
      <input type="hidden" id="editUserId"/>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input id="eName" type="text" class="form-control" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="eEmail" type="email" class="form-control" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input id="ePhone" type="tel" class="form-control"/>
      </div>
      <div class="form-group">
        <label class="form-label">New Password <span class="text-muted">(leave blank to keep current)</span></label>
        <input id="ePassword" type="password" class="form-control" placeholder="Leave blank to keep current"/>
      </div>
      <div id="editStudentFields">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input id="eStudentId" type="text" class="form-control"/>
          </div>
          <div class="form-group">
            <label class="form-label">Guardian Phone</label>
            <input id="eGuardian" type="tel" class="form-control"/>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem">
        <button type="button" class="btn btn-outline" onclick="closeModal('editUserModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Users");

  let allUsers = [];

  function toggleStudentFields(context) {
    const sel = context === 'add' ? document.getElementById("uType").value : null;
    if (context === 'add') {
      document.getElementById("addStudentFields").style.display = sel === "student" ? "" : "none";
    }
  }

  async function loadUsers() {
    allUsers = await api.get("/admin/users");
    renderUsers(allUsers);
  }

  function renderUsers(users) {
    const tbody = document.getElementById("usersTable");
    if (!users.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-muted" style="text-align:center;padding:2rem">No users found.</td></tr>`;
      return;
    }
    const typeColors = { admin: "badge-danger", teacher: "badge-info", student: "badge-success" };
    tbody.innerHTML = users.map((u, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td><span class="badge ${typeColors[u.type] || 'badge-neutral'}">${u.type}</span></td>
        <td>${u.student_id || '—'}</td>
        <td>${u.phone || '—'}</td>
        <td>${u.guardian_number || '—'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" onclick="editUser(${u.id})" title="Edit"><i data-lucide="edit-3"></i></button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${u.username.replace(/'/g, "\\'")}')" title="Delete"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>
    `).join("");
    if (window.lucide) lucide.createIcons();
  }

  function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    renderUsers(allUsers.filter(u =>
      u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (u.student_id || "").toLowerCase().includes(q)
    ));
  }

  function editUser(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    document.getElementById("editUserId").value = u.id;
    document.getElementById("eName").value = u.username;
    document.getElementById("eEmail").value = u.email;
    document.getElementById("ePhone").value = u.phone || "";
    document.getElementById("ePassword").value = "";
    document.getElementById("eStudentId").value = u.student_id || "";
    document.getElementById("eGuardian").value = u.guardian_number || "";
    document.getElementById("editStudentFields").style.display = u.type === "student" ? "" : "none";
    openModal("editUserModal");
  }

  async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
    try {
      await api.delete(`/admin/users/${id}`);
      showToast("User deleted.", "success");
      loadUsers();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  document.getElementById("addUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const type = document.getElementById("uType").value;
    const payload = {
      username: document.getElementById("uName").value.trim(),
      email:    document.getElementById("uEmail").value.trim(),
      password: document.getElementById("uPassword").value,
      phone:    document.getElementById("uPhone").value.trim(),
      type,
    };
    if (type === "student") {
      payload.student_id      = document.getElementById("uStudentId").value.trim();
      payload.guardian_number = document.getElementById("uGuardian").value.trim();
    }
    try {
      await api.post("/auth/register", payload);
      showToast("User created!", "success");
      closeModal("addUserModal");
      e.target.reset();
      loadUsers();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  document.getElementById("editUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = parseInt(document.getElementById("editUserId").value);
    const payload = {
      username:        document.getElementById("eName").value.trim(),
      email:           document.getElementById("eEmail").value.trim(),
      phone:           document.getElementById("ePhone").value.trim(),
      student_id:      document.getElementById("eStudentId").value.trim(),
      guardian_number: document.getElementById("eGuardian").value.trim(),
    };
    const pw = document.getElementById("ePassword").value;
    if (pw) payload.password = pw;
    try {
      await api.put(`/admin/users/${id}`, payload);
      showToast("User updated!", "success");
      closeModal("editUserModal");
      loadUsers();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  loadUsers().catch(() => showToast("Failed to load users", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
