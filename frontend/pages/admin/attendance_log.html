<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Log — AttendX Admin</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1><i data-lucide="calendar"></i> Attendance Log</h1>
      <p>All attendance records across the system.</p>
    </div>

    <div class="admin-actions-bar">
      <div class="search-box">
        <span class="search-icon"><i data-lucide="search"></i></span>
        <input type="text" id="searchInput" placeholder="Search by student, course, or teacher…" oninput="filterTable()"/>
      </div>
      <span class="text-muted" id="countLabel">Loading…</span>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>#</th><th>Date</th><th>Student</th><th>Student ID</th><th>Course</th><th>Teacher</th></tr>
          </thead>
          <tbody id="logTable">
            <tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Attendance");

  let allRecords = [];

  async function loadLog() {
    allRecords = await api.get("/admin/attendance");
    renderLog(allRecords);
    document.getElementById("countLabel").textContent = `${allRecords.length} records`;
  }

  function renderLog(records) {
    const tbody = document.getElementById("logTable");
    if (!records.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem">No records found.</td></tr>`;
      return;
    }
    tbody.innerHTML = records.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${fmtDate(r.date)}</td>
        <td>${r.student_name}</td>
        <td><code>${r.student_id || '—'}</code></td>
        <td>${r.course}</td>
        <td>${r.teacher}</td>
      </tr>
    `).join("");
  }

  function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    renderLog(allRecords.filter(r =>
      r.student_name.toLowerCase().includes(q) || r.course.toLowerCase().includes(q) || r.teacher.toLowerCase().includes(q) || (r.student_id || "").toLowerCase().includes(q)
    ));
  }

  loadLog().catch(() => showToast("Failed to load attendance log", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
