<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Courses — AttendX Admin</title>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1><i data-lucide="book-open"></i> Courses</h1>
      <p>Manage all courses — assign teachers and students.</p>
    </div>

    <div class="admin-actions-bar">
      <div class="search-box">
        <span class="search-icon"><i data-lucide="search"></i></span>
        <input type="text" id="searchInput" placeholder="Search by name…" oninput="filterTable()"/>
      </div>
      <button class="btn btn-primary" onclick="openAddCourse()">+ Add Course</button>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>#</th><th>Course Name</th><th>Teacher</th><th>Enrolled</th><th>Actions</th></tr>
          </thead>
          <tbody id="coursesTable">
            <tr><td colspan="5" class="text-muted" style="text-align:center;padding:2rem">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add Course Modal -->
<div class="modal-overlay" id="addCourseModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Create Course</h3>
      <button class="modal-close" onclick="closeModal('addCourseModal')">✕</button>
    </div>
    <form id="addCourseForm">
      <div class="form-group">
        <label class="form-label">Course Name</label>
        <input id="cName" type="text" class="form-control" placeholder="Database Systems" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Assign Teacher</label>
        <select id="cTeacher" class="form-control">
          <option value="">— Select Teacher —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Enroll Students</label>
        <div id="cStudentList" class="checkbox-list" style="max-height:200px; overflow-y:auto; padding:0.5rem; border:1px solid var(--border); border-radius:var(--radius-sm);"></div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <button type="button" class="btn btn-outline" onclick="closeModal('addCourseModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Course</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Course Modal -->
<div class="modal-overlay" id="editCourseModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Course</h3>
      <button class="modal-close" onclick="closeModal('editCourseModal')">✕</button>
    </div>
    <form id="editCourseForm">
      <input type="hidden" id="editCourseId"/>
      <div class="form-group">
        <label class="form-label">Course Name</label>
        <input id="eCName" type="text" class="form-control" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Assign Teacher</label>
        <select id="eCTeacher" class="form-control">
          <option value="">— Select Teacher —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Enroll Students</label>
        <div id="eCStudentList" class="checkbox-list" style="max-height:200px; overflow-y:auto; padding:0.5rem; border:1px solid var(--border); border-radius:var(--radius-sm);"></div>
      </div>
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <button type="button" class="btn btn-outline" onclick="closeModal('editCourseModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Courses");

  let allCourses = [];
  let allUsers = [];

  async function loadData() {
    [allCourses, allUsers] = await Promise.all([api.get("/admin/courses"), api.get("/admin/users")]);
    renderCourses(allCourses);
  }

  function getTeachers() { return allUsers.filter(u => u.type === "teacher"); }
  function getStudents() { return allUsers.filter(u => u.type === "student"); }

  function populateTeacherSelect(selectId, selectedId) {
    const sel = document.getElementById(selectId);
    sel.innerHTML = '<option value="">— Select Teacher —</option>';
    getTeachers().forEach(t => {
      sel.innerHTML += `<option value="${t.id}" ${t.id === selectedId ? 'selected' : ''}>${t.username}</option>`;
    });
  }

  function populateStudentCheckboxes(containerId, selectedIds = []) {
    const container = document.getElementById(containerId);
    const students = getStudents();
    if (!students.length) { container.innerHTML = '<p class="text-muted">No students registered.</p>'; return; }
    container.innerHTML = students.map(s => `
      <label style="display:flex; align-items:center; gap:0.5rem; padding:0.35rem 0; font-size:0.85rem; cursor:pointer;">
        <input type="checkbox" value="${s.id}" ${selectedIds.includes(s.id) ? 'checked' : ''}/>
        ${s.username} <code style="font-size:0.7rem">${s.student_id || ''}</code>
      </label>
    `).join("");
  }

  function getCheckedStudentIds(containerId) {
    return [...document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`)].map(cb => parseInt(cb.value));
  }

  function renderCourses(courses) {
    const tbody = document.getElementById("coursesTable");
    if (!courses.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-muted" style="text-align:center;padding:2rem">No courses found.</td></tr>`;
      return;
    }
    tbody.innerHTML = courses.map((c, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${c.name}</td>
        <td>${c.teacher}</td>
        <td><span class="badge badge-info">${c.enrolled} students</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" onclick="editCourse(${c.id})" title="Edit"><i data-lucide="edit-3"></i></button>
          <button class="btn btn-danger btn-sm" onclick="deleteCourse(${c.id}, '${c.name.replace(/'/g, "\\'")}')" title="Delete"><i data-lucide="trash-2"></i></button>
        </td>
      </tr>
    `).join("");
    if (window.lucide) lucide.createIcons();
  }

  function filterTable() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    renderCourses(allCourses.filter(c => c.name.toLowerCase().includes(q)));
  }

  function openAddCourse() {
    populateTeacherSelect("cTeacher");
    populateStudentCheckboxes("cStudentList");
    document.getElementById("addCourseForm").reset();
    openModal("addCourseModal");
  }

  function editCourse(id) {
    const c = allCourses.find(x => x.id === id);
    if (!c) return;
    document.getElementById("editCourseId").value = c.id;
    document.getElementById("eCName").value = c.name;
    populateTeacherSelect("eCTeacher", c.teacher_id);
    // Get enrolled student IDs from mock
    const mockCourses = JSON.parse(localStorage.getItem("ax_mock_courses") || "[]");
    const mc = mockCourses.find(x => x.id === id);
    const enrolledIds = mc ? (mc.student_ids || []) : [];
    populateStudentCheckboxes("eCStudentList", enrolledIds);
    openModal("editCourseModal");
  }

  async function deleteCourse(id, name) {
    if (!confirm(`Delete course "${name}"? All attendance records will be lost.`)) return;
    try {
      await api.delete(`/admin/courses/${id}`);
      showToast("Course deleted.", "success");
      loadData();
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  document.getElementById("addCourseForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById("cName").value.trim(),
      teacher_id: parseInt(document.getElementById("cTeacher").value) || null,
      student_ids: getCheckedStudentIds("cStudentList"),
    };
    try {
      await api.post("/admin/courses", payload);
      showToast("Course created!", "success");
      closeModal("addCourseModal");
      loadData();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  document.getElementById("editCourseForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = parseInt(document.getElementById("editCourseId").value);
    const payload = {
      name: document.getElementById("eCName").value.trim(),
      teacher_id: parseInt(document.getElementById("eCTeacher").value) || null,
      student_ids: getCheckedStudentIds("eCStudentList"),
    };
    try {
      await api.put(`/admin/courses/${id}`, payload);
      showToast("Course updated!", "success");
      closeModal("editCourseModal");
      loadData();
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  loadData().catch(() => showToast("Failed to load data", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
