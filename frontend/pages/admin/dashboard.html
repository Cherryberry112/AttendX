<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — AttendX</title>
  <meta name="description" content="System-wide statistics and overview for AttendX administrators."/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>Admin Dashboard</h1>
      <p>System-wide overview and statistics.</p>
    </div>

    <div class="stats-grid">
      <div class="card stat-card">
        <div class="stat-icon purple"><i data-lucide="users"></i></div>
        <div><div class="stat-value" id="statUsers">—</div><div class="stat-label">Total Users</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon teal"><i data-lucide="graduation-cap"></i></div>
        <div><div class="stat-value" id="statStudents">—</div><div class="stat-label">Students</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon yellow"><i data-lucide="award"></i></div>
        <div><div class="stat-value" id="statTeachers">—</div><div class="stat-label">Teachers</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon red"><i data-lucide="book-open"></i></div>
        <div><div class="stat-value" id="statCourses">—</div><div class="stat-label">Courses</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon purple"><i data-lucide="calendar"></i></div>
        <div><div class="stat-value" id="statAttendance">—</div><div class="stat-label">Attendance Records</div></div>
      </div>
    </div>

    <!-- Quick Links -->
    <h2 style="margin-bottom:1rem">Quick Actions</h2>
    <div class="grid-3" style="margin-bottom:2rem">
      <a href="users.html" class="card" style="text-decoration:none; text-align:center; padding:2rem;">
        <div style="font-size:2.5rem; margin-bottom:0.75rem"><i data-lucide="users"></i></div>
        <h3>Manage Users</h3>
        <p>Add, edit, delete users</p>
      </a>
      <a href="courses.html" class="card" style="text-decoration:none; text-align:center; padding:2rem;">
        <div style="font-size:2.5rem; margin-bottom:0.75rem"><i data-lucide="book-open"></i></div>
        <h3>Manage Courses</h3>
        <p>Create, edit, delete courses</p>
      </a>
      <a href="attendance_log.html" class="card" style="text-decoration:none; text-align:center; padding:2rem;">
        <div style="font-size:2.5rem; margin-bottom:0.75rem"><i data-lucide="calendar"></i></div>
        <h3>Attendance Log</h3>
        <p>All attendance records</p>
      </a>
    </div>
  </main>
</div>

<script src="../../js/utils.js"></script>
<script>
  if (!Auth.guard("admin")) throw new Error("Unauthorized");
  renderSidebar("admin", "Dashboard");

  api.get("/admin/stats").then(stats => {
    document.getElementById("statUsers").textContent     = stats.total_users;
    document.getElementById("statStudents").textContent  = stats.total_students;
    document.getElementById("statTeachers").textContent  = stats.total_teachers;
    document.getElementById("statCourses").textContent   = stats.total_courses;
    document.getElementById("statAttendance").textContent = stats.total_attendance;
  }).catch(() => showToast("Failed to load stats", "error"));
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
