<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AttendX — Smart Attendance System</title>
  <meta name="description" content="AttendX uses real-time face recognition to automate attendance tracking for educational institutions."/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">AX</div>
      <h1>AttendX</h1>
      <p>Smart Attendance with Face Recognition</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-group">
          <span class="input-icon"><i data-lucide="mail"></i></span>
          <input id="email" type="email" class="form-control" placeholder="you@university.edu" required autocomplete="email"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-icon"><i data-lucide="lock"></i></span>
          <input id="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-footer-text">
      Don't have an account? <a href="pages/register.html">Create one →</a>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script>
  // Redirect if already logged in
  (function() {
    const user = Auth.getUser();
    const token = Auth.getToken();
    if (user && token) {
      const role = user.type || user.role;
      window.location.href = `pages/${role}/dashboard.html`;
    }
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.textContent = "Signing in…";
    btn.disabled = true;

    try {
      const data = await api.post("/auth/login", {
        email:    document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      Auth.setToken(data.token);
      Auth.setUser({ id: data.id, username: data.username, type: data.type });
      showToast(`Welcome back, ${data.username}! `, "success");
      setTimeout(() => {
        window.location.href = `pages/${data.type}/dashboard.html`;
      }, 600);
    } catch (err) {
      showToast(err.message, "error");
      btn.textContent = "Sign In";
      btn.disabled = false;
    }
  });
</script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>
